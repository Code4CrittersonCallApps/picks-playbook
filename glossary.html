<style>*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font:15px/1.45 system-ui,-apple-system,sans-serif}.w{max-width:720px;margin:auto;padding:12px 14px 50px}h1{font-size:23px;margin:4px 0}a{color:#4da3ff}.m{color:#9aa4b2;font-size:13px}
.c{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px;margin:8px 0}.t{font-size:18px;font-weight:800;color:#ffd166}.say{font-style:italic;color:#c9d1d9;margin:4px 0}.p{font-size:13px;margin-top:6px}.p b{color:#79c0ff}input{width:100%;padding:12px;border-radius:10px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:16px}</style></head><body><div class=w>
<a href="./">← Picks Playbook</a> · <a href="roster.html">Roster</a> · <a href="briefing.html">Briefing</a><h1>🗣️ Say it right</h1><div class=m>Plain definitions, plus the signals that <i>prove</i> each one. Say it only when the proof is on the chart.</div>
<input id=q placeholder="Search a term…"><div id=g></div></div><script>
const G=[
['Risk-on','Money is chasing upside: buyers want the riskiest, highest-growth stuff.','"We\'re risk-on: small caps and alts are leading."','Small caps (IWM) beating the S&P · Nasdaq beating the Dow · BTC/alts up · high-yield credit (HYG) rising · dollar (DXY) falling · VIX < ~18'],
['Risk-off','Money is hiding: selling risk, buying safety.','"CPI flipped us risk-off: dollar up, small caps down."','DXY and yields up · HYG down · IWM lagging the SPX · gold or Treasuries bid · VIX spiking · alts bleeding vs BTC'],
['Mid-cycle','The middle of a bull: past the bottom, not near the top. Corrections happen but hold the trend.','"That −25% was a mid-cycle shakeout, not the top."','Price above the 50W MA · Pi Cycle ratio well under 1 · MVRV ~1.5–2.5 · the dip holds the 50W and reclaims fast'],
['Rotation','Money moving from one group to another, not leaving the market.','"Rotation out of BTC into large-cap alts."','BTC dominance falling while total crypto cap holds · ETH/BTC breaking up · sector ETFs diverging (XLK down, XLE up)'],
['Liquidity','How much money is available to buy assets (central-bank balance sheets, M2, credit).','"Liquidity is expanding, which is a tailwind even with high rates."','M2 growth y/y rising · Fed balance sheet/RRP drain · credit spreads tightening · DXY falling'],
['Breadth','How many things are participating in a move, not just the headline index.','"Breadth is thin: just the megacaps are holding SPX up."','% of stocks above their 50/200-day average · equal-weight vs cap-weight · advancers vs decliners · in crypto: how many of your watchlist are above EMA21'],
['Relative strength (RS)','How an asset performs vs a benchmark (usually BTC or SPX). This is NOT RSI.','"SUI has RS vs BTC: its ratio chart is making higher highs."','The asset/BTC ratio trending up · it outperforms on up days and falls less on down days'],
['Confluence','Several independent reasons pointing at the same price.','"$57.8k is confluence: macro .618 plus the June low, two reasons at one price."','Two or more of: fib level · prior support/resistance · 50W/200W MA · volume shelf · round number'],
['Regime','The market\'s current "weather" (bull, bear, chop, euphoria, capitulation), where rules and correlations behave differently.','"In a bear regime, BTC trades like the Nasdaq."','Price vs the 200-day, its slope, weekly RSI, 90-day return (the Correlation Lab regime rules)'],
['Dominance','BTC\'s share of the total crypto market cap.','"Dominance is still rising, so it\'s still BTC season, not alt season."','BTC.D trend: falling fast + ETH/BTC rising = alt-season window'],
['Beta','How much an asset moves for each 1% move of its benchmark.','"AVAX is high beta: it falls harder than BTC in selloffs."','Regression slope vs BTC/SPX (Correlation Lab beta column) · bigger swings both ways'],
['Drawdown','The fall from a peak to a later low, in %.','"BTC\'s drawdown hit −53% on Jun 30."','(low ÷ prior high) − 1 · always say from WHICH high'],
['R multiple','Profit or loss measured in units of what you risked (entry − stop = 1R).','"That trade paid 3R."','R = (exit − entry) ÷ (entry − stop) · plan trades with room ≥ 2R'],
['Retest','Price comes back to a level it just broke, to check whether it holds from the other side.','"BTC is retesting $80k from above."','A break, then a return to the level within days or weeks, then a hold (a wick in, close out)'],
['Reclaim','Price gets back ABOVE a level it had lost, and closes there.','"We reclaimed the 50W MA on Sep 18."','A daily or weekly CLOSE back above the lost level, ideally followed by a successful retest'],
['Capitulation','Forced, emotional, everybody-out selling that marks a washout low.','"A real capitulation shows a volume flush and long wicks, not just a red day."','A volume spike · long lower wicks · RSI < 25 · MVRV ≤ ~1 · price under the 200W · funding deeply negative']];
function draw(f=''){f=f.toLowerCase();document.getElementById('g').innerHTML=G.filter(x=>x.join(' ').toLowerCase().includes(f)).map(x=>`<div class=c><div class=t>${x[0]}</div><div>${x[1]}</div><div class=say>${x[2]}</div><div class=p><b>PROOF ON THE CHART</b><br>${x[3]}</div></div>`).join('')}
document.getElementById('q').oninput=e=>draw(e.target.value);draw();
</script></body></html>
